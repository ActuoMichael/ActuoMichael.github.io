<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Your Name – Digital Business Card</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0f172a;
      color: #e5e7eb;
    }

    .btn-contact {
    display: inline-block;
    padding: 0.6rem 1.2rem;
    border-radius: 999px;
    border: 1px solid #4b5563;
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    color: #e5e7eb;
    background: #0f172a;
    cursor: pointer;
  }
  .btn-contact:hover {
    background: #111827;
  }
    .card {
      background: #020617;
      padding: 2.5rem 2.8rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.7);
      max-width: 420px;
      width: 90%;
      text-align: center;
    }
    .name {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }
    .title {
      font-size: 1rem;
      color: #9ca3af;
      margin-bottom: 1.5rem;
    }
    .bio {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.8rem;
      color: #d1d5db;
    }
    .links a {
      display: inline-block;
      margin: 0.25rem 0.35rem;
      padding: 0.5rem 0.9rem;
      border-radius: 999px;
      text-decoration: none;
      font-size: 0.85rem;
      border: 1px solid #4b5563;
      color: #e5e7eb;
    }
    .links a:hover {
      background: #111827;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="name">Michael Holm</div>
    <div class="title">Actuary · Actuo</div>
    <p class="bio">
      Developing Europes greatest Solvency II solution.
    </p>
    <div class="links">
      <a href="mailto:mh@actuo.dk">Email</a>
      <a href="https://www.linkedin.com/in/michael-holm-951a49198/" target="_blank">LinkedIn</a>
      <a href="https://github.com/ActuoMichael" target="_blank">GitHub</a>
    </div>
    <div class="links">
      <a href="michael.vcf" download class="btn-contact">
      Add to contacts
      </a>
    </div>
  </div>
</body>
</html>
